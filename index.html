<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
    nav {
  background-color: #222;
  padding: 16px 18px;
  border-radius: 8px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  display: flex;
  gap: 10px;
  align-items: center;
}

    nav a {
  color: white;
  margin-right: 15px;
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 6px;
  transition: background-color 0.2s ease, transform 0.15s ease;
  font-weight: 600;
}

nav a:hover {
  background-color: #6c3cff;
  color: white;
  transform: translateY(-2px);
}
    .site-header {
        text-align: center;
        padding: 30px 10px;
    }

    .site-header h1 {
    font-size: 42px;
    letter-spacing: 1px;
    color: #6c3cff;
}  

 .site-header p {
    margin: 8px 0 0;
    color: #666;
    font-size: 16px;
    letter-spacing: 2px;
}   

    main h2 {
  font-size: 36px;
  color: #6c3cff;
  margin-top: 0;
  margin-bottom: 14px;
  letter-spacing: 0.5px;
  line-height: 1.2; 
          text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 1px;
}

  main p {
  font-size: 19px;
  line-height: 1.7;
  margin: 0;
 max-width: 750px;
  letter-spacing: 0.2px;
        color: #333;
  font-weight: 400;
  margin-top: 4px;
}
      main {
  padding: 65px 45px;
  background-color: #f5f3ff;
  border: 1px solid #e2dcff;
  border-radius: 20px;
  margin: 45px 30px;
  box-shadow: 0 8px 20px rgba(108, 60, 255, 0.16);
            position: relative;
  overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  cursor: default;
  will-change: transform;
            border-top: 3px solid #6c3cff;
  border-bottom: 3px solid #6c3cff;
  box-sizing: border-box;
            box-shadow: inset 0 0 18px rgba(108, 60, 255, 0.08);
}

        main:hover {
  transform: translateY(-3px);
      transition: transform 0.2s ease;
  will-change: transform;        
  box-shadow: 0 10px 22px rgba(108, 60, 255, 0.16);
        }
</style>
</head>

<body>

<header class="site-header">
    <h1>My Website</h1>
    <p>Discover. Rate. Track. Discuss.</p>
</header>
<nav>
    <a href="#">Home</a>
    <a href="#">Movies</a>
    <a href="#">TV Shows</a>
    <a href="#">Anime</a>
    <a href="#">Community</a>
</nav>
    <main>
        <h2>Welcome</h2>
   <p>Track what you watch, discover what to watch next, and share your favorites with the community.</p>     
    </main>

</body>
</html>
