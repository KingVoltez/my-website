<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
    nav {
  background-color: #222;
  padding: 16px 18px;
  border-radius: 8px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  display: flex;
  gap: 10px;
  align-items: center;
}

    nav a {
  color: white;
  margin-right: 15px;
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 6px;
  transition: background-color 0.2s ease, transform 0.15s ease;
  font-weight: 600;
}

nav a:hover {
  background-color: #6c3cff;
  color: white;
  transform: translateY(-2px);
}
    .site-header {
        text-align: center;
        padding: 30px 10px;
    }

    .site-header h1 {
    font-size: 42px;
    letter-spacing: 1px;
    color: #6c3cff;
}  

 .site-header p {
    margin: 8px 0 0;
    color: #666;
    font-size: 16px;
    letter-spacing: 2px;
}   
main h2 {
  font-size: 32px;
  margin-top: 30px;
  margin-bottom: 10px;
}
    main h2 {
  font-size: 36px;
  color: #6c3cff;
  margin-top: 0;
  margin-bottom: 14px;
}

  main p {
  font-size: 19px;
  line-height: 1.7;
  margin: 0;
}
      main {
  padding: 50px 30px;
  background-color: #f5f3ff;
  border: 1px solid #e2dcff;
  border-radius: 12px;
  margin: 30px 20px;
  box-shadow: 0 6px 16px rgba(108, 60, 255, 0.12);
}  
        
</style>
</head>

<body>

<header class="site-header">

</header>
<nav>

</nav>
    <main>

   <p>Track what you watch, discover what to watch next, and share your favorites with the community.</p>     
    </main>

</body>
</html>
